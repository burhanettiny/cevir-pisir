name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Play Store yükleme anahtarı (Settings > Secrets and variables > Actions). Yoksa yalnızca APK derlenir.
      ANAHTAR_B64: ${{ secrets.YUKLEME_ANAHTARI_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm ci

      - name: Testler
        run: npm test

      - name: Web dosyalarını Android projesine aktar
        run: npm run android

      - name: APK derle
        working-directory: android
        env:
          SURUM_KODU: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Play Store paketi (AAB) derle
        if: env.ANAHTAR_B64 != ''
        working-directory: android
        env:
          HAM_SIFRE: ${{ secrets.YUKLEME_ANAHTARI_SIFRE }}
          SURUM_KODU: ${{ github.run_number }}
        run: |
          # Kopyalarken karışabilecek boşluk/satır sonlarını ve "Şifre (...): " önekini temizle.
          export YUKLEME_ANAHTARI_SIFRE="$(printf '%s' "$HAM_SIFRE" | tr -d '\r\n' | sed 's/^.*: *//; s/[[:space:]]*$//; s/^[[:space:]]*//')"
          printf '%s' "$ANAHTAR_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Şifrenin kendisi yazdırılmaz; yalnızca uzunluğu ve harf/rakam dışı karakter içerip içermediği.
          echo "Şifre uzunluğu: ${#YUKLEME_ANAHTARI_SIFRE} (beklenen 24)"
          case "$YUKLEME_ANAHTARI_SIFRE" in *[!A-Za-z0-9]*) echo "::warning::Şifrede harf/rakam dışı karakter var; ANAHTAR-BILGISI.txt'deki 24 karakteri yeniden kopyalayın.";; esac
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$YUKLEME_ANAHTARI_SIFRE" >/dev/null 2>&1 \
            || { echo "::error::YUKLEME_ANAHTARI_SIFRE anahtarla eşleşmiyor. GitHub > Settings > Secrets'ta şifreyi ANAHTAR-BILGISI.txt'deki 24 karakterle güncelleyin."; exit 1; }
          export YUKLEME_ANAHTARI="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab ../cevir-pisir.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: AAB derleme denemesi (yükleme anahtarı yokken, test anahtarıyla; yayınlanmaz)
        if: env.ANAHTAR_B64 == ''
        working-directory: android
        env:
          YUKLEME_ANAHTARI: ${{ github.workspace }}/android/cevir-pisir-debug.keystore
          YUKLEME_ANAHTARI_SIFRE: android
          YUKLEME_ANAHTARI_ADI: androiddebugkey
        run: |
          ./gradlew bundleRelease --no-daemon
          ls -la app/build/outputs/bundle/release/

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cevir-pisir.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cevir-pisir-apk
          path: cevir-pisir.apk

      - uses: actions/upload-artifact@v4
        if: hashFiles('cevir-pisir.aab') != ''
        with:
          name: cevir-pisir-aab-play-store
          path: cevir-pisir.aab

      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DOSYALAR="cevir-pisir.apk"
          [ -f cevir-pisir.aab ] && DOSYALAR="$DOSYALAR cevir-pisir.aab"
          gh release create "v1.0.${{ github.run_number }}" $DOSYALAR \
            --title "Çevir Pişir 1.0.${{ github.run_number }}" \
            --notes "Android için Çevir Pişir. Telefonunuzda **cevir-pisir.apk** dosyasına dokunup indirin ve kurun (bilinmeyen kaynaklardan kuruluma izin vermeniz gerekebilir). **cevir-pisir.aab** (varsa) Play Console'a yüklenecek pakettir." \
            --latest
