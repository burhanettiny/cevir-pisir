name: Yemek görseli adayları

# Yalnızca elle çalıştırılır: Wikimedia'dan aday fotoğrafları ve lisans bilgilerini toplar,
# seçim için geçici bir ön sürüme (gorsel-adaylari) zip olarak koyar. Seçim bitince bu sürüm silinir.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Adayları topla
        run: node scripts/gorsel-adaylari.mjs
      - name: Geçici ön sürüme yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr gorsel-adaylari.zip aday
          gh release delete gorsel-adaylari --yes --cleanup-tag 2>/dev/null || true
          gh release create gorsel-adaylari gorsel-adaylari.zip --prerelease --latest=false \
            --title "Görsel adayları (geçici)" --notes "Seçim için geçici dosya; seçimden sonra silinir."
