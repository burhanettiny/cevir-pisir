name: Yemek görseli adayları

# Yalnızca elle çalıştırılır: Wikimedia'dan aday fotoğrafları ve lisans bilgilerini toplar,
# seçim için artifact olarak yükler. Seçilenler depoya ayrıca eklenir.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Adayları topla
        run: node scripts/gorsel-adaylari.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gorsel-adaylari
          path: aday/
          retention-days: 7
