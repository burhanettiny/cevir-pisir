<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f4">
  <meta name="description" content="Ne yiyoruz? Çarkı çevir, yemeğini seç: tarif, kalori, protein–karbonhidrat dengesi, alışveriş listesi, dolabındakilerle tarif ve sofra menüleri.">
  <title>Çevir Pişir</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="ikon/ikon.svg" type="image/svg+xml">
  <link rel="preload" href="yazi/manrope-latin-ext-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/stil.css">
</head>
<body>
  <header class="ust">
    <button class="ust-dugme" id="geri" aria-label="Geri" hidden></button>
    <h1 id="baslik">Çevir Pişir</h1>
    <span class="ust-sag" id="ustSag"></span>
  </header>

  <main id="ekran" tabindex="-1"></main>

  <nav class="alt" aria-label="Ana menü">
    <a href="#/" data-sekme="ana"><span data-ikon="ferris-wheel"></span>Çevir</a>
    <a href="#/dolabim" data-sekme="dolabim"><span data-ikon="refrigerator"></span>Dolabım</a>
    <a href="#/sofralar" data-sekme="sofralar"><span data-ikon="utensils-crossed"></span>Sofralar</a>
    <a href="#/favoriler" data-sekme="favoriler"><span data-ikon="heart"></span>Favoriler</a>
    <a href="#/liste" data-sekme="liste"><span data-ikon="shopping-cart"></span>Liste<b id="listeSayi" hidden></b></a>
  </nav>

  <div class="perde" id="perde" hidden></div>
  <section class="cekmece" id="cekmece" hidden aria-modal="true" role="dialog"></section>
  <div class="onay-perde" id="onay" hidden role="alertdialog" aria-modal="true"></div>
  <div class="bildirim" id="bildirim" role="status" aria-live="polite"></div>

  <script type="module" src="js/uygulama.js"></script>
</body>
</html>
